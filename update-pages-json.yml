name: Update pages.json

on:
  push:
    paths:
      - "*.html"
      - "pages.json"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate pages.json
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync(".")
              .filter(f => f.endsWith(".html") && f !== "recherche.html");
            fs.writeFileSync("pages.json", JSON.stringify(files, null, 2));
          '

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages.json
          git diff --cached --quiet || git commit -m "Update pages.json"
          git push